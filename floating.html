<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMP Brand Concierge floating</title>

  <!--
    AMP Brand Concierge: reference host page for the floating bar.
    The bar takes its colours and fonts from styleConfigurations.js (the Composer export), so it matches the main chat.
    On the real AMP page, add: the Web SDK and its configure call, styleConfigurations.js, main.js, then
    amp-bc-floating.css and amp-bc-floating.js. There is no mount element: the script adds the bar.
  -->

  <!-- 1. Web SDK base code (creates the "alloy" command queue) -->
  <script>
    !function (n, o) {
      o.forEach(function (o) {
        n[o] || ((n.__alloyNS = n.__alloyNS || []).push(o), n[o] = function () {
          var u = arguments;
          return new Promise(function (i, l) { n[o].q.push([i, l, u]); });
        }, n[o].q = []);
      });
    }(window, ["alloy"]);
  </script>
  <script src="https://cdn1.adoberesources.net/alloy/2.35.1/alloy.min.js"></script>

  <!-- 3. Styling configuration, then the Brand Concierge web client (Adobe CDN) -->
  <script src="new-customer/styleConfigurations.js"></script>
  <script src="https://experience.adobe.net/solutions/experience-platform-brand-concierge-web-agent/static-assets/main.js"></script>

  <!-- Floating bar layout (colours and fonts come from the style configuration) -->
  <link rel="stylesheet" href="amp-bc-floating.css">

  <!-- 2. Web SDK configuration -->
  <script>
    alloy("configure", {
      defaultConsent: "in",
      edgeDomain: "edge.adobedc.net",
      edgeBasePath: "ee",
      datastreamId: "6943a42a-d5c6-4361-9266-469e59d4d01c",      // datastream AMP's UAT site uses
      orgId: "11BA6EA55322342B0A490D44@AdobeOrg",          // AMP SERVICES LIMITED
      idMigrationEnabled: false,
      thirdPartyCookiesEnabled: false,
      conversation: { region: "aus5" }       // routes Brand Concierge calls to AMP's Australian region
    });
    alloy("sendEvent", {});
  </script>
</head>

<body style="margin:0; background:#ffffff;">

  <!-- Floating component: no mount element here. amp-bc-floating.js adds the bar and panel to the page. -->
  <script src="amp-bc-floating.js"></script>
</body>
</html>
